<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.HostName}} 分享的文件</title>
<style>
:root { --bg:#0a0e16; --card:#131a28; --border:#1e2940; --txt:#e3e9f2; --dim:#7d8aa0; --neon:#38bdf8; --neon2:#34d399; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--txt);
  font-family:system-ui,"Microsoft YaHei",sans-serif; padding:20px;
  background-image:radial-gradient(800px 400px at 80% -10%, rgba(56,189,248,.08), transparent 60%); }
.wrap { max-width:560px; margin:0 auto; }
h1 { font-size:18px; margin:8px 0 4px; }
h1 b { background:linear-gradient(90deg,var(--neon),var(--neon2));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.sub { font-size:12px; color:var(--dim); margin:0 0 16px; }
ul { list-style:none; padding:0; margin:0 0 16px; }
li { display:flex; align-items:center; gap:12px; background:var(--card);
  border:1px solid var(--border); border-radius:12px; padding:13px 15px; margin-bottom:10px; }
.info { flex:1; min-width:0; }
.name { font-size:14px; word-break:break-all; }
.size { font-size:12px; color:var(--dim); margin-top:3px; }
a.dl { flex-shrink:0; text-decoration:none; font-size:13px; font-weight:600; color:#06121f;
  padding:8px 18px; border-radius:8px; background:linear-gradient(90deg,var(--neon),var(--neon2)); }
a.dl:active { filter:brightness(1.15); }
.tip { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>📦 <b>{{.HostName}}</b> 分享了 {{len .Files}} 项</h1>
  <p class="sub">想下哪个点哪个;文件夹会整个打包成 zip</p>
  {{if .Files}}
  <ul>
  {{range .Files}}<li><div class="info"><div class="name">{{.Icon}} {{.Name}}</div><div class="size">{{.SizeText}}</div></div><a class="dl" href="{{.Href}}" download>{{.Btn}}</a></li>
  {{end}}</ul>
  {{else}}<p class="tip">分享里暂时没有文件(可能都被发送方移除了),找对方再加一下。</p>{{end}}
  <p class="tip">大文件支持断点续传;下载期间对方的程序需保持开启,否则链接失效。</p>
</div>
</body>
</html>
